name: TikTok Live Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Discord secret
        shell: bash
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "✅ DISCORD_WEBHOOK_URL ir pieejams."
          else
            echo "❌ DISCORD_WEBHOOK_URL ir tukšs!"
            exit 1
          fi

      - name: Check TikTok LIVE
        run: |
          python tiktok_bot.py

      - name: Save live_status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live_status.json

          if git diff --cached --quiet; then
            echo "ℹ️ Nav izmaiņu live_status.json"
          else
            git commit -m "Update TikTok live status"
            git push
            echo "✅ live_status.json saglabāts GitHub."
          fi
