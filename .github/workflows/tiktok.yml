name: TikTok Live Check

on:
  schedule:
    # Pārbaude ik pēc 10 minūtēm
    - cron: "*/10 * * * *"

  # Ļauj palaist manuāli no GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-live:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # RUN BOT
      # ======================================================

      - name: Check TikTok LIVE
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python tiktok_bot.py

      # ======================================================
      # SAVE STATUS
      # ======================================================

      - name: Save live_status.json
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live_status.json

          if git diff --cached --quiet; then
            echo "ℹ️ Nav izmaiņu live_status.json"
          else
            git commit -m "Update TikTok live status"
            git push
            echo "✅ live_status.json saglabāts GitHub."
          fi
